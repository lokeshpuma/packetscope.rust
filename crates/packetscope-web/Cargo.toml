[package]
name = "packetscope-web"
version = "0.1.0"
edition = "2021"
authors = ["PacketScope Contributors"]
description = "Web interface and WebAssembly frontend for PacketScope"
license = "MIT OR Apache-2.0"

[dependencies]
packetscope-core = { path = "../packetscope-core" }
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
gloo-file = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "HtmlAnchorElement",
    "FileReader",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Event",
    "DragEvent",
    "DataTransfer",
    "FileList",
    "File",
    "ProgressEvent",
    "MessageEvent",
    "Worker",
    "Storage",
    "KeyboardEvent",
    "MouseEvent",
    "console",
]
