[package]
name = "packetscope-core"
version = "0.1.0"
edition = "2021"
authors = ["PacketScope Contributors"]
description = "Core packet analysis, protocol dissection, flow aggregation, filtering, and findings engine"
license = "MIT OR Apache-2.0"

[dependencies]
pcap-parser = "0.17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
